<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{width:1080px;height:1350px;overflow:hidden;position:relative}
.wrap{position:absolute;inset:0;padding:72px 80px 64px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:128px;margin-top:60px}
.sub{font-family:"Bricolage Grotesque";font-weight:700;font-size:54px;letter-spacing:-.02em;margin-top:26px;line-height:1.05}
.sub2{font-size:32px;color:var(--muted);margin-top:12px}
.mid{display:flex;gap:44px;margin-top:44px;flex:1;min-height:0}
.left{flex:1;display:flex;flex-direction:column;gap:22px}
.box{border:2px solid var(--line);border-radius:28px;padding:26px 28px}
.lbl{font-size:28px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.val{font-family:"Bricolage Grotesque";font-weight:800;font-size:58px;letter-spacing:-.03em;line-height:1;margin-top:8px}
.slots{margin-top:18px;gap:7px}
.slots span{font-size:22px;border-width:2.5px;border-radius:8px}
.chk{font-size:29px;line-height:1.2;color:var(--light);margin-top:4px}
.right{width:330px;position:relative}
.phone{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:48px;padding:11px}
.phone .scr{border-radius:38px}
.cta{padding:30px 40px;margin-top:34px}
.cta .big{font-size:64px}
.cta .s{font-size:30px;font-weight:600;text-align:right;line-height:1.2}
.foot{display:flex;justify-content:space-between;font-size:28px;color:var(--muted);margin-top:24px}
</style></head><body><div class="wrap">
<div class="top">
  <div class="brand"><img src="icon.png">OrderFlow</div>
  <div class="tag"><svg viewBox="0 0 24 24"><path d="M13.5 2 4 14h7l-1.5 8L20 10h-7l.5-8z" fill="#1E1A1B"/></svg>CAMPANHA RELÂMPAGO</div>
</div>
<h1 class="h">1ª mensalidade<br><span class="or">grátis.</span></h1>
<div class="sub">E sem taxa de implantação.</div>
<div class="sub2">A gente monta o cardápio ou catálogo da sua loja.</div>
<div class="mid">
  <div class="left">
    <div class="box">
      <div class="lbl">Só para</div>
      <div class="val"><span class="or">10</span> primeiras lojas</div>
      <div class="slots"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div>
    </div>
    <div class="box">
      <div class="lbl">Válido até</div>
      <div class="val">sexta, <span class="or">07/11</span></div>
    </div>
    <div class="chk" style="margin-top:auto"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#F26522" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Comida, adega, água, gás e ração</div>
    
  </div>
  <div class="right"><div class="phone"><div class="scr"><img src="cardapio.webp"></div></div></div>
</div>
<div class="cta"><div class="big">Comente QUERO</div><div class="s">que a gente<br>te chama</div></div>
<div class="foot"><span>@orderflow.tec</span><span>orderflow.tec.br</span></div>
</div></body></html>
