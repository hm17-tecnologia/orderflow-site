<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{width:1080px;height:1920px;overflow:hidden;position:relative}
.wrap{position:absolute;inset:0;padding:230px 80px 300px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{font-size:36px}
.tag{margin-top:40px;font-size:30px;padding:16px 28px 16px 22px}
.tag svg{width:34px;height:34px}
h1{font-size:142px;margin-top:48px}
.sub{font-family:"Bricolage Grotesque";font-weight:700;font-size:60px;letter-spacing:-.02em;margin-top:30px;line-height:1.05}
.sub2{font-size:36px;color:var(--muted);margin-top:14px}
.row{display:flex;gap:22px;margin-top:60px;width:100%}
.box{flex:1;border:2px solid var(--line);border-radius:30px;padding:30px 24px}
.lbl{font-size:30px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.val{font-family:"Bricolage Grotesque";font-weight:800;font-size:68px;letter-spacing:-.03em;line-height:1;margin-top:10px}
.slots{margin-top:30px;width:100%;gap:10px}
.slots span{font-size:30px}
.note{font-size:32px;color:var(--muted);margin-top:26px;margin-bottom:48px}
.cta{margin-top:auto;width:100%;flex-direction:column;padding:38px 40px;gap:8px}
.cta .big{font-size:84px}
.cta .s{font-size:34px;font-weight:600}
</style></head><body><div class="wrap">
<div class="brand"><img src="icon.png">OrderFlow</div>
<div class="tag"><svg viewBox="0 0 24 24"><path d="M13.5 2 4 14h7l-1.5 8L20 10h-7l.5-8z" fill="#1E1A1B"/></svg>CAMPANHA RELÂMPAGO</div>
<h1 class="h">Primeira<br>mensalidade<br><span class="or">grátis.</span></h1>
<div class="sub">E sem taxa de implantação.</div>
<div class="sub2">A gente monta o cardápio da sua loja.</div>
<div class="row">
  <div class="box"><div class="lbl">Só para</div><div class="val"><span class="or">10</span> lojas</div></div>
  <div class="box"><div class="lbl">Válido até</div><div class="val">seg, <span class="or">02/11</span></div></div>
</div>
<div class="slots"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div>
<div class="note">Cardápio com a sua marca e sem comissão por pedido.</div>
<div class="cta"><div class="big">Responda QUERO</div><div class="s">aqui no story que a gente te chama</div></div>
</div></body></html>
